<!DOCTYPE html>
<meta charset="UTF-8">
<html>

<head>
  <style>
    a {
      font-size: 12px;
    }

    #container {
      display: grid;
      grid-template-columns: 8fr 4fr;
    }

    #subcontainer {
      display: grid;
      grid-template-columns: 10% 90%;
    }

    textarea {
      font-size: small;
      resize: none;
    }
  </style>
</head>
<script>


  let CONFIGURATION;
  let toolFrame;

  let DEFAULTCONFIG = `{
uiscale: 1.0,
barprecision: .01,
barposition: [-6, 14],
barwidth: 20,
barheight: 1.5,
barpadding: 2.5,
barvalue: 0.0,

subdivisions: 1,
unit: "MB",

// müssen wohl eher nicht geändert werden
// Cindyvariablen sind noch nicht möglich 
//barcolor: DZLMCOLORGOLD,
//fontfamily: NADA,

leftoutpercentages: [],

leftoutvalues: [],
custompercentages: [],
customvalues: [],
scaffoldbasevalue: false,
scaffoldvalue: false,
scaffoldpercentage: false,
isbardraggable: true,
alwaysdrawarches: true,
snapbar: false,
decimalspercentage: 2,
decimalsvalue: 2,
numberofbars: 1,
keepstable: "basevalue",
showbuttons: true,
overflow: false,
hidetoggles: [

  // Toggles COL1 
  // "percentage",
  // "part",
  // "basevalue",
  // "parts",
  // "percentages",
  //
  // Toggles COL2
  // "arch",
  // "showtf-div",
  // "showtf-divpercentage",
  // "showtf-divvalue",
  //
  //Toggles COL3
  // "showtf-perc",
  // "showtf-value",
  // "showtf-base",
  // "overflow"
],

//Toggle States
//Toggles are inactive by default, if set to true,
//the corresponding toggle will be active
toggleStates: {

  // Toggles COL1 
  "percentage": false,
  "part": false,
  "basevalue": false,
  "parts": false,
  "percentages": false,

  // Toggles COL2
  "arch": false,
  "showtf-div": false,
  "showtf-divpercentage": false,
  "showtf-divvalue": false,

  //Toggles COL3
  "showtf-perc": false,
  "showtf-value": false,
  "showtf-base": false,
  "overflow": false
},


//TogglePlacement
toggleAnchorpointOffset: [0, 0],
toggleOffsetYFactor: {
  // The higher the factor the futher up the toggle will be
  //Toggles COL1 
  percentage: 4,
  part: 3,
  basevalue: 2,
  parts: 1,
  percentages: 0,

  //Toggles COL2
  arch: 3,
  showtfdiv: 2,
  showtfdivpercentage: 1,
  showtfdivvalue: 0,
  //Toggles COL3
  showtfperc: 3,
  showtfvalue: 2,
  showtfbase: 1,
  overflow: 0
},

numpadOffset: [-9, -9.5],
numpadKeysize: 1.5,

archesHeightFactor: 1,
showBackgroundGrid: false,

ARTICULATEVARIABLES: [

  /* Beispiel:
   Die Variablen müssen vorher in Articulate angelegt werden (hier "test" und "test1")
  {
    // Anteil am Streifen in Prozent
    cindyValue: "bars_1.value*100",
    articulateVariable: "test"
  },
  {
    // Anzahl der Schritte am Streifen 
    cindyValue: "length(bars_1.ticks)",
    articulateVariable: "test1"
  }
 */

],

// store state of every Percentagebar in a cache 
storeState: true,

// time in milliseconds, for the first communication between articulate and the webobject 
startCallbackDelay: 25



    }`;

  function storeConifguration() {
    localStorage.setItem("prozentetool-configuration", configeditor.value)

  }



  function setupLinenumbers(e) {

    linenumbers.textContent = `
`;

  }

  function updateLinenumbers(e) {

    let configLines = configeditor.value.split("\n");
    let lineIsNumbered = configLines.map(it => !!!it.match(/^\s*\/\//));
    let numbers = [];
    let count = 0;
    configLines.forEach(it => {
      count += 1;
      numbers.push(count.toString())

    });

    linenumbers.textContent = numbers.join("\n");


  }



  function setConfiguration(value) {
    configeditor.value = value;
    updateLinenumbers()

  }



  window.onload = () => {
    linenumbers.style["text-align"] = "right";

    configeditor.addEventListener("scroll", (e) => {
      linenumbers.scrollTop = configeditor.scrollTop;

    })

    configeditor.addEventListener("input", updateLinenumbers);

    let storedConfig = localStorage.getItem("prozentetool-configuration");
    setConfiguration((storedConfig) ? storedConfig : DEFAULTCONFIG);


  }
  // function configWithoutComments() {
  //   return configeditor.value.split("\n").filter(it => !it.match(/^\s*\/\//)).join("\n");
  // }

  // function config2ClipboardWithoutComments() {
  //   // Get the text field
  //
  //   // Select the text field
  //   configeditor.select();
  //   configeditor.setSelectionRange(0, 99999); // For mobile devices
  //
  //   // Copy the text inside the text field
  //   navigator.clipboard.writeText(configWithoutComments());
  // }


  function config2Clipboard() {
    // Get the text field

    // Select the text field
    configeditor.select();
    configeditor.setSelectionRange(0, 99999); // For mobile devices

    // Copy the text inside the text field
    navigator.clipboard.writeText(configeditor.value);
  }



  function parseConfiguration() {
    let parseResult;
    let editorValue = configeditor.value;
    let editorValueObject;

    try {
      eval(`editorValueObject = ${editorValue}`)
    } catch (error) {
      alert(error)
    }


    return editorValueObject

  }


  function createToolFrame() {


    CONFIGURATION = parseConfiguration();


    storeConifguration()



    let toolDiv = document.getElementById("toolDiv");
    if (toolFrame != undefined) toolDiv.removeChild(toolFrame);

    toolFrame = document.createElement("iframe");
    toolFrame.setAttribute("id", "toolFrame");
    toolFrame.setAttribute("src", "./index_.html");
    toolFrame.setAttribute("width", "95%");
    toolFrame.setAttribute("height", "95%");


    let msgChannel = new MessageChannel();
    msgChannel.port1.onmessage = (msg) => {
      console.log("Communication: Articulate got a message via MessageChannel port");
      switch (msg.data.method) {
        case "get":
          console.log("Communication: Handling method='get'")
          //player.__dotarray_data.timings.push(new Date().getTime());
          let tiles;
          if (msg.data.key != undefined) {
            console.log(`Communication: get tiles with label '${msg.data.key}'`)
            //tiles = player.__dotarray_data.allTiles[msg.data.key];
          } else {
            console.log("Communication: get all tiles")
            //tiles = player.__dotarray_data.allTiles;
          }
          msgChannel.port1.postMessage({method: "get", value: tiles})
          break;
        case "set":
          console.log("Communication: Handling method='set'")
          break;
        default:

          console.log("Communication: The message (via MessageChannel) could not be handled by Articulate\n", msg)
          break;
      }
    };


    function onLoad() {
      console.log(`Articulate: run onLoad for iframe, initalize MessageChannels`)
      toolFrame.contentWindow.postMessage({method: "init", configuration: CONFIGURATION}, "*", [
        msgChannel.port2
      ]);
    }

    toolFrame.addEventListener("load", onLoad);

    toolDiv.appendChild(toolFrame);

  }

</script>

<body>
  <h3>Prozentstreifentool Konfiguration</h3>
  <div id="container">

    <div id="toolDiv">
      <h3>Prozentstreifentool</h3>

    </div>

    <div id="linklist-unit-2">
      <h3>Konfigurations-Editor</h3>
      <div id="subcontainer">
        <textarea id="linenumbers" rows="52" cols="1" spellcheck=false></textarea>
        <textarea id="configeditor" rows="52" cols="80" spellcheck=false></textarea>
      </div>
      <button onclick="createToolFrame()"> Anwenden </button>
      <button onclick="config2Clipboard()"> Kopieren </button>
      <button onclick="setConfiguration(DEFAULTCONFIG)"> Zurücksetzen auf Standardkonfig </button>


    </div>
  </div>


</body>
<html>
